name: GitHub Classroom Workflow

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: DEPLOY
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: persons
          POSTGRES_USER: program
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Шаг 1: Клонируем репозиторий
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Шаг 2: Установка Python и зависимостей
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r djangoProject/requirements.txt

      # Шаг 4: Make migrations
      - name: Make migrations
        run: |
          . venv/bin/activate
          python djangoProject/myproject/manage.py makemigrations

      # Шаг 5: Применение миграций
      - name: Run migrations
        run: |
          . venv/bin/activate
          python djangoProject/myproject/manage.py migrate

      # Шаг 6: Запуск тестов Django
      - name: Run Django Tests
        run: |
          . venv/bin/activate
          python djangoProject/myproject/manage.py test
      - name: Install SSH Key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Connect and Deploy
        run: ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.SERVER_WORKDIR }} && git pull && make deploy"

      - name: Clean
        run: rm -rf ~/.ssh


      # Шаг 12: Запуск тестов API через Postman
      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: lab1-template/postman/[inst] Lab1.postman_collection.json
          environment: lab1-template/postman/[inst] Lab1.postman_environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      # Шаг 13: Автогрейдинг
      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{ secrets.GOOGLE_API_KEY }}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 1
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"
