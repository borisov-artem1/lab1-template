name: GitHub Classroom Workflow

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    name: Dependencies
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: persons
          POSTGRES_USER: program
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      # Шаг 1: Клонируем репозиторий
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Шаг 2: Установка Python и зависимостей
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install -r djangoProject/requirements.txt

      # Шаг 4: Make migrations
      - name: Make migrations
        run: |
          . venv/bin/activate
          python djangoProject/myproject/manage.py makemigrations

      # Шаг 5: Применение миграций
      - name: Run migrations
        run: |
          . venv/bin/activate
          python djangoProject/myproject/manage.py migrate

      # Шаг 3: Запуск тестов (если они есть)
      - name: Run Django Tests
        run: |
          . venv/bin/activate
          python djangoProject/manage.py test

      # Шаг 4: Устанавливаем SSH-ключ для доступа к серверу
      - name: Install SSH Key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      # Шаг 5: Копирование файлов и запуск docker-compose на сервере
      - name: Deploy to Yandex Cloud
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DOCKER_COMPOSE_FILE: docker-compose.yml
        run: |
          # Архивируем проект
          tar -czf project.tar.gz .
          
          # Копируем архив на сервер
          scp -P $SSH_PORT project.tar.gz $SSH_USER@$SSH_HOST:/home/$SSH_USER/project.tar.gz

          # Подключаемся к серверу и запускаем обновление контейнеров
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST << EOF
            cd /home/$SSH_USER
            tar -xzf project.tar.gz -C /home/$SSH_USER/my_project
            cd my_project
            docker-compose down
            docker-compose up --build -d
          EOF

      # Шаг 6: Чистка временных файлов
      - name: Clean up
        run: rm -rf ~/.ssh project.tar.gz

